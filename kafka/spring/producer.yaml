# Copy into Reservations / Product-Post / Member application.yaml
# Bootstrap is injected by compose: SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:19092
spring:
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
