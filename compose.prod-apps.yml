      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:3306/category_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m

  listing:
    <<: *app-common
    image: p4rksk1611/valuehub-listing:${IMAGE_TAG:-prod}
    container_name: valuehub-listing
    depends_on:
      discovery:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *media-env
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:3306/product_post_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

  member-regions:
    <<: *app-common
    image: p4rksk1611/valuehub-member-regions:${IMAGE_TAG:-prod}
    container_name: valuehub-member-regions
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      <<: *media-env
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:3306/member_regions_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m

  reports:
