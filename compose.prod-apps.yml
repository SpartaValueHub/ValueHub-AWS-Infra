    image: p4rksk1611/valuehub-chat:${IMAGE_TAG:-prod}
    container_name: valuehub-chat
    depends_on:
      discovery:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *media-env
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:3306/chat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_MONGODB_URI: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_HOST}:27017/${MONGODB_DATABASE}?replicaSet=${MONGODB_REPLICA_SET}&authSource=admin
