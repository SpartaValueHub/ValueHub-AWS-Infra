      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

networks:
  valuehub-apps:
    name: valuehub-apps
    driver: bridge

volumes:
  redis-data:
  kafka-data:
