    container_name: valuehub-reports
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      <<: *media-env
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8087"
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:3306/reports_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m

  reservations:
