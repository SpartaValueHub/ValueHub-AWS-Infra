      SERVER_PORT: "8089"
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:3306/notifications_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
