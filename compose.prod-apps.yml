# ValueHub Prod — Apps EC2 (microservices + Redis + Kafka)
# DB runs on a separate EC2. Set MYSQL_HOST / MONGODB_HOST to DB private IP.
# Kafka is on this compose network; producers/consumers use kafka:19092.
#
#   cp env/apps.env.example .env
#   # put JWT PEMs in ./secrets/ (see secrets/README.md)
#   docker compose -f compose.prod-apps.yml --env-file .env up -d

x-app-common: &app-common
  platform: linux/amd64
  restart: unless-stopped
  networks:
    - valuehub-apps

# Media (S3 + CloudFront) — values from Apps EC2 .env; EC2 Instance Role used for AWS API
x-media-env: &media-env
  AWS_REGION: ${AWS_REGION:-ap-northeast-2}
  S3_BUCKET: ${S3_BUCKET}
  CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
  CLOUDFRONT_BASE_URL: ${CLOUDFRONT_BASE_URL}
  CLOUDFRONT_DISTRIBUTION_ID: ${CLOUDFRONT_DISTRIBUTION_ID:-}

services:
  redis:
    <<: *app-common
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka-data-init:
    image: apache/kafka:4.3.1
    platform: linux/amd64
    container_name: valuehub-kafka-data-init
    restart: "no"
    user: root
    volumes:
      - kafka-data:/var/lib/kafka/data
    entrypoint:
      - bash
      - -lc
      - mkdir -p /var/lib/kafka/data && chown -R 1000:1000 /var/lib/kafka/data
    networks:
      - valuehub-apps

  kafka:
    <<: *app-common
    image: apache/kafka:4.3.1
    container_name: valuehub-kafka
    hostname: kafka
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  kafka-init:
    image: apache/kafka:4.3.1
    platform: linux/amd64
    container_name: valuehub-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - bash
      - -lc
      - |
        set -euo pipefail
        BT=/opt/kafka/bin/kafka-topics.sh
        BS=kafka:19092
        for t in reservation.events product.events member.events; do
          $$BT --bootstrap-server $$BS --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
        $$BT --bootstrap-server $$BS --list
    networks:
      - valuehub-apps

  kafka-ui:
    <<: *app-common
    image: kafbat/kafka-ui:latest
    container_name: valuehub-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: valuehub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  discovery:
    <<: *app-common
    image: p4rksk1611/valuehub-discovery:${IMAGE_TAG:-prod}
    container_name: valuehub-discovery
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8761"
      EUREKA_INSTANCE_HOSTNAME: discovery
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  gateway:
    <<: *app-common
    image: p4rksk1611/valuehub-gateway:${IMAGE_TAG:-prod}
    container_name: valuehub-gateway
    depends_on:
      discovery:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8000"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      SECURITY_JWT_ENABLED: ${SECURITY_JWT_ENABLED:-true}
      JWT_PUBLIC_KEY_LOCATION: file:/secrets/jwt-public.pem
      AUTH_COOKIE_ACCESS_NAME: ${AUTH_COOKIE_ACCESS_NAME:-vh_access_token}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  auth:
    <<: *app-common
    image: p4rksk1611/valuehub-auth:${IMAGE_TAG:-prod}
    container_name: valuehub-auth
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      <<: *media-env
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      JWT_PRIVATE_KEY_LOCATION: file:/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_LOCATION: file:/secrets/jwt-public.pem
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-14}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET:-}
      CI_HASH_KEY: ${CI_HASH_KEY:-}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    volumes:
      - ./secrets:/secrets:ro

  member:
    <<: *app-common
    image: p4rksk1611/valuehub-member:${IMAGE_TAG:-prod}
    container_name: valuehub-member
    depends_on:
      discovery:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *media-env
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:3306/member_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

  category:
    <<: *app-common
    image: p4rksk1611/valuehub-category:${IMAGE_TAG:-prod}
    container_name: valuehub-category
    depends_on:
      discovery:
        condition: service_healthy
    environment:
