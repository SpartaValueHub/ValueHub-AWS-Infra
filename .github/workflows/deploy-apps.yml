name: Deploy Apps (Prod)

on:
  push:
    branches: [main]
    paths:
      - "compose.prod-apps.yml"
      - "env/**"
      - "scripts/**"
      - ".github/workflows/deploy-apps.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag"
        required: false
        default: "dev"

concurrency:
  group: deploy-apps-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sync compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.APPS_EC2_HOST }}
          username: ${{ secrets.APPS_EC2_USER }}
          key: ${{ secrets.APPS_EC2_SSH_KEY }}
          source: "compose.prod-apps.yml"
          target: /opt/valuehub-aws-infra
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.APPS_EC2_HOST }}
          username: ${{ secrets.APPS_EC2_USER }}
          key: ${{ secrets.APPS_EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/valuehub-aws-infra
            TAG="${{ github.event.inputs.image_tag || 'dev' }}"
            IMAGE_TAG="$TAG" docker compose -f compose.prod-apps.yml --env-file .env pull
            IMAGE_TAG="$TAG" docker compose -f compose.prod-apps.yml --env-file .env up -d --remove-orphans
            docker image prune -f
            IMAGE_TAG="$TAG" docker compose -f compose.prod-apps.yml --env-file .env ps
            curl -sf http://127.0.0.1:8000/health || true
